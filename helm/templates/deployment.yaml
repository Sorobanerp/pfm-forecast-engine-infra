apiVersion: apps/v1
kind: Deployment
metadata:
  name: pfm-forecast-engine-go
  namespace: pfm-platform
  labels:
    app: pfm-forecast-engine-go
    tags.datadoghq.com/service: "pfm-forecast-engine-go"
    tags.datadoghq.com/env: "production"
    tags.datadoghq.com/version: "0.1.0"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: pfm-forecast-engine-go
  template:
    metadata:
      labels:
        app: pfm-forecast-engine-go
        tags.datadoghq.com/service: "pfm-forecast-engine-go"
        tags.datadoghq.com/env: "production"
        tags.datadoghq.com/version: "0.1.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: pfm-forecast-engine-go
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: grpc
              containerPort: {{ .Values.ports.container }}
              protocol: TCP
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
