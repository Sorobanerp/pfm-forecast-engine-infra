replicaCount: 1
image:
  repository: ghcr.io/dantas-pfm/pfm-forecast-engine-go
  tag: "local"
service:
  grpcPort: 9091
env:
  REDIS_ADDR: "localhost:6379"
  KAFKA_BROKERS: "localhost:9092"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "250m"
    memory: "128Mi"
