ports:
  # container = porta de escuta do processo (env); service = porta do Service K8s
  container: 18110
  service: 18110
replicaCount: 1
image:
  repository: ghcr.io/dantas-pfm/pfm-forecast-engine-go
  tag: "local"
service:
  grpcPort: 18110
env:
  GRPC_PORT: "18110"
  REDIS_ADDR: "localhost:16379"
  KAFKA_BROKERS: "localhost:19092"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "250m"
    memory: "128Mi"
